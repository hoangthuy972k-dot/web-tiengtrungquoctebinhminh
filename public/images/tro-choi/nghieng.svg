    <path d="M154 122 A46 46 0 0 1 246 122 Q236 98 212 102 Q198 88 178 100 Q160 106 154 122Z" fill="#4a2c2a" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round"/>
