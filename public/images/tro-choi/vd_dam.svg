  <g transform="translate(222 150) rotate(-38)">
    <rect x="-20" y="40" width="42" height="64" rx="8" fill="#fff8ec" stroke="#2b1d3a" stroke-width="4"/>
    <rect x="-18" y="52" width="38" height="7" fill="#ffc94d"/>
    <path d="M-24 46 C-30 26 -32 4 -22 -14 C-14 -30 16 -34 32 -20 C46 -8 46 18 36 34 C34 38 32 42 31 46 Z" fill="#ef4f43" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M31 45 C32 42 34 38 36 34 C46 18 46 -8 32 -20 C40 -2 36 26 22 45 Z" fill="#c9342c"/>
    <path d="M-12 16 C0 22 14 21 27 13" fill="none" stroke="#2b1d3a" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <path d="M-21 8 C-35 3 -46 14 -43 26 C-40 38 -28 43 -18 36 C-13 28 -14 14 -21 8 Z" fill="#f2635a" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="-6" cy="-14" rx="10" ry="5.5" fill="#fff" opacity="0.6" transform="rotate(-25 -6 -14)"/>
  </g>

  <!-- vach toc do -->
