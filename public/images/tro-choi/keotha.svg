      <stop offset="0" stop-color="#5ab0ff"/>
      <stop offset="1" stop-color="#3f51b5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#keotha-bg)"/>
  <circle cx="30" cy="200" r="80" fill="#fff8ec" opacity="0.08"/>
  <circle cx="370" cy="36" r="64" fill="#fff8ec" opacity="0.12"/>
  <circle cx="200" cy="20" r="40" fill="#b9dcff" opacity="0.12"/>
  <path d="M0 212 Q200 196 400 212 V240 H0Z" fill="#2f3f99" opacity="0.5"/>
  <rect x="36" y="30" width="328" height="182" rx="22" fill="#fff8ec" opacity="0.12"/>

  <!-- connector lines -->
  <g fill="none" stroke-linecap="round">
