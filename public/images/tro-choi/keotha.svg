    <rect x="56" y="103" width="72" height="44" rx="12"/>
    <rect x="56" y="157" width="72" height="44" rx="12"/>
    <rect x="272" y="49" width="72" height="44" rx="12"/>
    <rect x="272" y="103" width="72" height="44" rx="12"/>
    <rect x="272" y="157" width="72" height="44" rx="12"/>
  </g>
  <!-- card faces -->
  <g fill="#fff8ec" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round">
    <rect x="56" y="44" width="72" height="44" rx="12"/>
    <rect x="56" y="98" width="72" height="44" rx="12"/>
    <rect x="56" y="152" width="72" height="44" rx="12"/>
    <rect x="272" y="44" width="72" height="44" rx="12"/>
    <rect x="272" y="98" width="72" height="44" rx="12"/>
    <rect x="272" y="152" width="72" height="44" rx="12"/>
