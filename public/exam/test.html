<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thi thử HSK — Hi Hán 喜汉</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect x=%225%22 y=%225%22 width=%2290%22 height=%2290%22 rx=%2222%22 fill=%22%23c84b31%22/><text x=%2250%22 y=%2268%22 font-size=%2250%22 text-anchor=%22middle%22 fill=%22%23fff6e9%22 font-family=%22sans-serif%22 font-weight=%22700%22>试</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/exam/exam.css" />
</head>
<body>
  <header class="ex-top">
    <div><button type="button" class="ex-pill" id="exBack"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>Trở về</button></div>
    <h1 id="exTitle">Thi thử HSK</h1>
    <div class="ex-top-right">
      <button type="button" class="ex-pill" id="exOptBtn" aria-expanded="false">Tùy chọn <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
      <div class="ex-menu" id="exMenu" hidden>
        <h4>Cài đặt</h4>
        <label>Tốc độ audio <span class="chip" id="exSpeedVal">1x</span></label>
        <input type="range" id="exSpeed" min="0.5" max="1.5" step="0.25" value="1" />
        <label style="margin-top:12px"><span>Hiện pinyin</span><input type="checkbox" id="exPy" checked /></label>
      </div>
    </div>
  </header>

  <div class="ex-layout">
    <main class="ex-main" id="exMain">
      <p style="color:#6b625c;padding:20px">Đang tải đề thi…</p>
    </main>
    <aside class="ex-side" id="exSide"></aside>
  </div>

  <div id="exModalRoot"></div>
  <script src="/exam/exam.js"></script>
</body>
</html>
