    <rect x="62" y="102" width="18" height="4" rx="2"/>
    <rect x="62" y="156" width="18" height="4" rx="2"/>
    <rect x="278" y="48" width="18" height="4" rx="2"/>
    <rect x="278" y="102" width="18" height="4" rx="2"/>
    <rect x="278" y="156" width="18" height="4" rx="2"/>
