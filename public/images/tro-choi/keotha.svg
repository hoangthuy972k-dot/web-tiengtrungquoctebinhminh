    <path d="M0 -8 Q9 -14 18 -10 V10 Q9 6 0 12Z" fill="#ffb38a" stroke="#2b1d3a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M-13 -4 Q-8 -6 -4 -3 M-13 1 Q-8 -1 -4 2 M4 -3 Q8 -6 13 -4 M4 2 Q8 -1 13 1" fill="none" stroke="#fff8ec" stroke-width="1.6" stroke-linecap="round"/>
