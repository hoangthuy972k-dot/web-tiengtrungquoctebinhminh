<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Bạn nhỏ nghiêng đầu trước webcam để chọn thẻ đúng bên trái hoặc thẻ sai bên phải">
  <defs>
    <linearGradient id="nghieng-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a6b"/>
      <stop offset="1" stop-color="#c2412d"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#nghieng-bg)"/>
  <circle cx="60" cy="190" r="80" fill="#fff8ec" opacity="0.08"/>
  <circle cx="350" cy="40" r="70" fill="#ffd27a" opacity="0.14"/>
  <circle cx="200" cy="120" r="96" fill="#fff8ec" opacity="0.07"/>
  <path d="M0 206 Q200 188 400 206 V240 H0Z" fill="#a8321f" opacity="0.45"/>

  <!-- camera view cone -->
  <path d="M190 40 L128 196 L272 196 L210 40Z" fill="#fff8ec" opacity="0.1"/>

  <!-- left card (check) -->
  <circle cx="69" cy="100" r="54" fill="#fff8ec" opacity="0.18"/>
  <rect x="30" y="64" width="78" height="72" rx="16" fill="#fff8ec" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M88 133 L114 156 L102 133" fill="#fff8ec" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round"/>
  <rect x="36" y="122" width="66" height="8" rx="4" fill="#f1e2c6"/>
  <circle cx="69" cy="99" r="22" fill="#3bb273" stroke="#2b1d3a" stroke-width="3.5"/>
  <path d="M57 100 L66 109 L81 92" fill="none" stroke="#fff8ec" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- right card (cross) -->
  <rect x="292" y="64" width="78" height="72" rx="16" fill="#fff8ec" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M312 133 L286 156 L298 133" fill="#fff8ec" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round"/>
  <rect x="298" y="122" width="66" height="8" rx="4" fill="#f1e2c6"/>
  <circle cx="331" cy="99" r="22" fill="#e5484d" stroke="#2b1d3a" stroke-width="3.5"/>
  <path d="M323 91 L339 107 M339 91 L323 107" fill="none" stroke="#fff8ec" stroke-width="5.5" stroke-linecap="round"/>

