<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Kéo nối chữ Hán 书, 水, 猫 với hình quyển sách, giọt nước và mặt mèo bằng các đường cong nhiều màu">
  <defs>
