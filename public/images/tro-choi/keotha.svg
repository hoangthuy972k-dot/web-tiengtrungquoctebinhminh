    <path d="M132 66 C200 66 200 174 268 174" stroke="#ffd23f" stroke-width="6"/>
    <path d="M132 120 C200 120 200 66 268 66" stroke="#ff7eb6" stroke-width="6"/>
    <path d="M132 174 C185 174 196 131 229 131" stroke="#7ef0c8" stroke-width="6"/>
  </g>

  <!-- card lips -->
  <g fill="#d9ccb2" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round">
