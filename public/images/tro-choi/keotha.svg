  <g transform="translate(308 64)">
    <path d="M0 -15 C6 -7 12 -1 12 5 A12 12 0 0 1 -12 5 C-12 -1 -6 -7 0 -15Z" fill="#5ab0ff" stroke="#2b1d3a" stroke-width="2.5" stroke-linejoin="round"/>
