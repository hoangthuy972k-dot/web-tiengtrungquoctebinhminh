  <path d="M104 134 Q95 155 104 176" fill="none" stroke="#fff8ec" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <path d="M156 132 Q165 152 158 172" fill="none" stroke="#fff8ec" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <path d="M118 124 L144 116 L144 182 L118 190 Z" fill="#5c6bc0" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round"/>
