  <path d="M124 134 L138 130" stroke="#fff8ec" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M131 145 L136 153 L131 162 L126 155 Z" fill="#fff8ec" opacity="0.85"/>
  <path d="M118 124 L144 116 L144 182 L118 190 Z" fill="none" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round"/>

