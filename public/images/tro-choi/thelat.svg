      <rect x="171" y="122" width="58" height="59" rx="8" fill="#5c6bc0"/>
      <rect x="178" y="129" width="44" height="52" rx="5" fill="none" stroke="#fff8ec" stroke-width="2" opacity="0.55"/>
      <path d="M200 142 L210 155 L200 168 L190 155 Z" fill="#fff8ec" opacity="0.85"/>
      <circle cx="184" cy="135" r="2" fill="#fff8ec" opacity="0.7"/><circle cx="216" cy="175" r="2" fill="#fff8ec" opacity="0.7"/>
