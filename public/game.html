<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trò chơi ôn từ · Hi Hán 喜汉</title>
<meta name="description" content="Trò chơi ôn từ vựng tiếng Trung — chọn cấp độ, chọn bài rồi chơi. Dùng được cả khi tự học lẫn khi chiếu lên lớp.">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700;900&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/lop.css">
<link rel="stylesheet" href="/css/arcade.css">
<link rel="stylesheet" href="/css/game-hub.css">
</head>
<body class="lop-body gh-body">

<div class="scene" aria-hidden="true">
  <div class="scene-layer scene-far"></div>
  <div class="scene-mist"></div>
  <div class="scene-layer scene-tree"></div>
  <div class="scene-layer scene-bamboo"></div>
  <div class="scene-veil"></div>
</div>

<!-- ═════════════ MÀN CHUẨN BỊ ═════════════ -->
<div id="ghSetup" class="lop-setup">
  <div class="lop-setup-card">
    <div class="lop-setup-head">
      <div class="lop-logo">喜汉</div>
      <div>
        <h1>Trò chơi ôn từ</h1>
        <p>Chọn cấp độ và bài muốn ôn — trò chơi lấy đúng từ vựng của những bài đó</p>
      </div>
    </div>

    <div class="lop-field">
      <label>1 · Chơi kiểu nào</label>
      <div class="gh-mode" id="ghMode">
        <button type="button" data-mode="hoc" class="active">
          <b>🎧 Tự học</b>
          <i>Có đồng hồ và điểm số — tự chơi trên máy hoặc điện thoại</i>
        </button>
        <button type="button" data-mode="lop">
          <b>📽️ Chiếu lớp</b>
          <i>Chữ to, không đếm ngược — thầy/cô bấm sau khi học sinh đọc</i>
        </button>
      </div>
    </div>

    <div class="lop-field">
      <label for="ghLevel">2 · Cấp độ</label>
      <select id="ghLevel"></select>
    </div>

    <div class="lop-field">
      <label>3 · Chọn bài để lấy từ vựng</label>
      <div class="lop-lesson-tools">
        <button type="button" class="lop-mini" id="ghAll">Chọn tất cả</button>
        <button type="button" class="lop-mini" id="ghNone">Bỏ chọn</button>
        <button type="button" class="lop-mini" id="ghRand">🎲 Quay ngẫu nhiên 1 bài</button>
      </div>
      <p class="gh-count" id="ghCount">Chưa chọn bài nào.</p>
      <div id="ghLessons" class="lop-lessons">Đang tải…</div>
    </div>

    <div class="lop-field">
      <label>4 · Chọn trò chơi</label>
      <div class="gh-games" id="ghGames"></div>
    </div>

    <p class="lop-note">💡 Chọn nhiều bài cùng lúc để ôn tổng hợp. Khi chiếu lớp, bấm <b>F11</b> cho toàn màn hình.</p>
  </div>
</div>

<!-- ═════════════ MÀN CHƠI ═════════════ -->
<div id="ghPlay" class="gh-play" hidden>
  <header class="gh-play-top">
    <button type="button" class="gh-back" id="ghBack">← Đổi bài / đổi trò</button>
    <span class="gh-play-ten" id="ghPlayTen"></span>
    <span class="gh-play-bai" id="ghPlayBai"></span>
  </header>
  <main class="gh-play-body" id="ghStage"></main>
</div>

<script src="/js/data.js"></script>
<script src="/js/arcade.js"></script>
<script src="/js/game-hub.js"></script>
</body>
</html>
