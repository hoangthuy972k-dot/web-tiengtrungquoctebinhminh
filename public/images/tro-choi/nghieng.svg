  <path d="M113 122 L127 122 L120.5 133Z" fill="#fff8ec" stroke="#fff8ec" stroke-width="2" stroke-linejoin="round"/>
  <path d="M250 75 L239 86 L236 72Z" fill="#fff8ec" stroke="#fff8ec" stroke-width="2" stroke-linejoin="round"/>

  <!-- webcam -->
  <rect x="190" y="36" width="20" height="8" rx="3" fill="#3d3550" stroke="#2b1d3a" stroke-width="3"/>
  <rect x="174" y="12" width="52" height="28" rx="14" fill="#3d3550" stroke="#2b1d3a" stroke-width="3.5"/>
  <rect x="180" y="15" width="14" height="4" rx="2" fill="#6b6085"/>
  <circle cx="200" cy="26" r="10" fill="#6ec6ff" stroke="#2b1d3a" stroke-width="3"/>
  <circle cx="200" cy="26" r="4.5" fill="#2b1d3a"/>
  <circle cx="197" cy="23" r="2" fill="#fff8ec"/>
  <circle cx="217" cy="20" r="2.5" fill="#ff5a5a"/>

  <!-- sparkles -->
  <path d="M30 40 Q30 47 37 47 Q30 47 30 54 Q30 47 23 47 Q30 47 30 40Z" fill="#fff8ec"/>
  <path d="M118 50 Q118 54 122 54 Q118 54 118 58 Q118 54 114 54 Q118 54 118 50Z" fill="#fff8ec" opacity="0.9"/>
  <path d="M372 160 Q372 165 377 165 Q372 165 372 170 Q372 165 367 165 Q372 165 372 160Z" fill="#fff8ec" opacity="0.8"/>
  <circle cx="44" cy="160" r="2.5" fill="#fff8ec" opacity="0.8"/>
  <circle cx="300" cy="30" r="2" fill="#fff8ec" opacity="0.7"/>
  <circle cx="340" cy="190" r="2" fill="#fff8ec" opacity="0.6"/>
