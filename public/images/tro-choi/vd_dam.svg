<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Găng đấm đỏ đấm trúng thẻ đáp án, bao cát lật đật đứng bên cạnh, trước camera">
  <defs>
    <linearGradient id="vddam-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b693ff"/>
      <stop offset="1" stop-color="#6a3fc4"/>
    </linearGradient>
    <path id="vddam-spark" d="M0 -7 Q1 -1 7 0 Q1 1 0 7 Q-1 1 -7 0 Q-1 -1 0 -7 Z" fill="#fff8ec"/>
  </defs>

  <rect width="400" height="240" fill="url(#vddam-bg)"/>
  <circle cx="58" cy="42" r="72" fill="#fff8ec" opacity="0.12"/>
  <circle cx="362" cy="70" r="56" fill="#fff8ec" opacity="0.1"/>
  <circle cx="330" cy="222" r="96" fill="#4a2a96" opacity="0.25"/>
  <path d="M0 200 Q200 180 400 200 V240 H0 Z" fill="#55309f"/>
  <path d="M0 200 Q200 180 400 200" fill="none" stroke="#d6c2ff" stroke-width="3" opacity="0.45"/>

  <!-- the trai (mo) -->
  <g transform="rotate(-5 92 78)" opacity="0.92">
    <rect x="40" y="46" width="104" height="66" rx="16" fill="#fffdf8" stroke="#2b1d3a" stroke-width="4"/>
    <path d="M44 100 H140 V96 Q140 108 128 108 H56 Q44 108 44 96 Z" fill="#1fa89a"/>
    <text x="92" y="88" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="700" font-size="30" fill="#3a2a24">你好</text>
  </g>

  <!-- the phai (bi dam trung, nut) -->
  <g transform="rotate(7 212 82)">
    <rect x="158" y="48" width="112" height="70" rx="16" fill="#e3f7ea" stroke="#2b1d3a" stroke-width="4"/>
    <path d="M162 106 H266 V102 Q266 114 254 114 H174 Q162 114 162 102 Z" fill="#2f8a57"/>
    <text x="214" y="92" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="700" font-size="32" fill="#145a32">谢谢</text>
    <path d="M232 50 L224 66 L236 74 L226 92 L238 100 L232 116" fill="none" stroke="#2b1d3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- vu no BOP -->
  <path d="M236 122 L250 96 L262 120 L290 106 L282 134 L312 140 L286 156 L300 182 L270 172 L262 202 L246 176 L218 190 L226 162 L198 152 L226 142 Z" fill="#ffd23f" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M242 132 L252 116 L260 132 L278 124 L272 142 L290 146 L274 156 L282 172 L264 166 L258 184 L248 168 L230 176 L236 158 L218 152 L236 146 Z" fill="#fff3a6"/>

