      <circle cx="114" cy="57" r="2" fill="#fff8ec" opacity="0.7"/><circle cx="146" cy="97" r="2" fill="#fff8ec" opacity="0.7"/>
      <rect x="101" y="44" width="58" height="66" rx="8" fill="none" stroke="#2b1d3a" stroke-width="3.5"/>
    </g>
    <g>
      <rect x="241" y="44" width="58" height="66" rx="8" fill="#3949ab"/>
      <rect x="241" y="44" width="58" height="59" rx="8" fill="#5c6bc0"/>
      <rect x="248" y="51" width="44" height="52" rx="5" fill="none" stroke="#fff8ec" stroke-width="2" opacity="0.55"/>
      <path d="M270 64 L280 77 L270 90 L260 77 Z" fill="#fff8ec" opacity="0.85"/>
      <circle cx="254" cy="57" r="2" fill="#fff8ec" opacity="0.7"/><circle cx="286" cy="97" r="2" fill="#fff8ec" opacity="0.7"/>
      <rect x="241" y="44" width="58" height="66" rx="8" fill="none" stroke="#2b1d3a" stroke-width="3.5"/>
