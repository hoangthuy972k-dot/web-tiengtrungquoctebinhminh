<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Bàn thẻ lật với hai thẻ chữ Hán đã mở và bàn tay đang lật thẻ">
  <defs>
    <linearGradient id="thelat-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb86b"/>
      <stop offset="1" stop-color="#e0702a"/>
    </linearGradient>
    <linearGradient id="thelat-mat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4dbfa9"/>
      <stop offset="1" stop-color="#2f9c88"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#thelat-bg)"/>
  <circle cx="40" cy="48" r="70" fill="#fff8ec" opacity="0.14"/>
  <circle cx="372" cy="196" r="88" fill="#fff8ec" opacity="0.1"/>
  <circle cx="356" cy="40" r="34" fill="#ffd8a8" opacity="0.4"/>
  <circle cx="34" cy="204" r="26" fill="#c75b1c" opacity="0.25"/>
  <path d="M0 214 Q200 198 400 214 L400 240 L0 240 Z" fill="#c95f1f" opacity="0.45"/>

