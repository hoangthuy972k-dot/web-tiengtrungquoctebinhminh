<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nông trại của em · Hi Hán 喜汉</title>
<meta name="description" content="Nông trại của em — học bài, kiếm sao rồi mua gà, bò, hoa, đèn lồng để trang trí nông trại đẹp nhất lớp. Mỗi món đều có tên chữ Hán.">
<meta name="theme-color" content="#7cc4f2">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/cau-dt.css">
<link rel="stylesheet" href="/css/nong-trai.css">
<link rel="stylesheet" href="/css/nong-trai-kt.css">
</head>
<body class="nt">

<header class="nt-top">
  <a class="nt-ve" href="/" aria-label="Về trang học"><span aria-hidden="true">←</span><b>Học bài</b></a>
  <button type="button" class="nt-nv-nut" id="ntNvNut" aria-label="Nhân vật của em" title="Nhân vật của em"></button>
  <div class="nt-hud">
    <button type="button" class="nt-chip nt-chip-lv" id="ntLv" aria-label="Cấp nông trại">
      <img src="/images/farm/ic-xp.svg" alt="" draggable="false">
      <span class="nt-lv-so" id="ntLvSo">1</span>
      <span class="nt-xp"><i id="ntXpThanh"></i></span>
    </button>
    <button type="button" class="nt-chip" id="ntSao" aria-label="Sao học tập">
      <img src="/images/farm/ic-sao.svg" alt="" draggable="false">
      <b id="ntSaoSo">0</b>
      <span class="nt-chip-cong" aria-hidden="true">+</span>
    </button>
    <button type="button" class="nt-chip" id="ntXu" aria-label="Xu nông trại — đổi sao lấy xu" title="Đổi sao lấy xu">
      <img src="/images/farm/ic-xu.svg" alt="" draggable="false">
      <b id="ntXuSo">0</b>
      <span class="nt-chip-cong nt-chip-doi" aria-hidden="true">⇄</span>
    </button>
  </div>
</header>

<!-- Goc phai: muc tieu hom nay (sao + nhiem vu ke tiep, thu gon duoc) + 1 chip trang thai (thien tai / khien).
     Cac hoat dong it dung (thu thach chu Han, vong quay, ho cau, don hang...) nam trong bang "Thêm" o thanh duoi. -->
<div class="nt-phai" id="ntPhai">
  <div class="nt-nvc" id="ntNvc">
    <button type="button" class="nt-muc" id="ntMuc" aria-label="Mục tiêu học hôm nay">
  <span class="nt-muc-vong" aria-hidden="true"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" class="nt-muc-nen"/><circle cx="18" cy="18" r="15" class="nt-muc-dat" id="ntMucVong" pathLength="100" stroke-dasharray="0 100"/></svg><img src="/images/farm/ic-sao.svg" alt="" draggable="false"></span>
  <span class="nt-muc-chu"><b id="ntMucSo">0/20</b><small id="ntMucPhu">sao hôm nay</small></span>
<i class="nt-cham" id="ntHocCham" hidden></i></button>
    <button type="button" class="nt-nvc-gon" id="ntNvGon" aria-expanded="true" aria-controls="ntNvTiep" aria-label="Thu gọn nhiệm vụ"><span aria-hidden="true">▾</span></button>
    <button type="button" class="nt-nvc-tiep" id="ntNvTiep" hidden></button>
  </div>
  <!-- Thien tai: chip nho (bam de xem / chong) -->
  <button type="button" class="nt-tai-thanh" id="ntTai" hidden></button>
</div>

<!-- Goc trai: cay cham chi, thach dau dang dien ra, co vang / ruy bang / ke cup (ca khi ban sang tham) -->
<div class="nt-trai-cot" id="ntTraiCot"></div>

<div class="nt-tham" id="ntTham" hidden>
  <div class="nt-tham-chu">
    <b id="ntThamTen"></b>
    <span id="ntThamPhu"></span>
  </div>
  <div class="nt-tham-nut">
    <button type="button" class="nt-nut nt-nut-hong" id="ntThamTim">❤ Thả tim</button>
    <button type="button" class="nt-nut" id="ntThamChao">💬 Nói chuyện</button>
    <button type="button" class="nt-nut nt-nut-vang" id="ntThamSap">🛒 Sạp của bạn</button>
    <button type="button" class="nt-nut nt-nut-vang" id="ntThamTiem">🏪 Tiệm của bạn</button>
    <button type="button" class="nt-nut" id="ntThamTt">🏘 Thị trấn</button>
    <button type="button" class="nt-nut nt-nut-hong" id="ntThamTai" hidden>🆘 Giúp chống thiên tai</button>
    <button type="button" class="nt-nut nt-nut-vang" id="ntThamThich" hidden>👍 Thích nông trại</button>
    <button type="button" class="nt-nut" id="ntThamTdh" hidden>⚔ Thách đấu học</button>
  </div>
  <p class="nt-tham-goi" id="ntThamGoi"></p>
  <div class="nt-tham-ve">
    <button type="button" class="nt-nut nt-nut-vang" id="ntThamLui" hidden>← Về thị trấn</button>
    <button type="button" class="nt-nut" id="ntThamVe">🏠 Về nông trại của em</button>
  </div>
</div>

<main class="nt-khung" id="ntKhung">
  <div class="nt-dat" id="ntDat"></div>
</main>

<div class="nt-noi" id="ntNoi" hidden></div>

<div class="nt-thanh-dat" id="ntThanhDat" hidden>
  <span id="ntThanhDatChu"></span>
  <button type="button" class="nt-nut nt-nut-xanh" id="ntDatXong">Xong</button>
</div>

<!-- Thi tran cua lop: moi ban 1 lo dat, ve thu nho nong trai that -->
<section class="nt-tt" id="ntThiTran" hidden aria-labelledby="ntTtTen">
  <header class="nt-tt-dau">
    <img class="nt-tt-cong" src="/images/farm/cong.svg" alt="" draggable="false">
    <div class="nt-tt-bien">
      <h1 id="ntTtTen">Thị trấn</h1>
      <p><span id="ntTtCap"><span lang="zh">小镇</span> xiǎozhèn</span> · <span id="ntTtPhu"></span></p>
      <p class="nt-tt-dh" id="ntTtDh" hidden></p>
    </div>
    <div class="nt-tt-nut">
      <button type="button" class="nt-nut nt-nut-vang" data-tt="cho">🛒 Chợ lớp</button>
      <button type="button" class="nt-nut nt-nut-vang" data-tt="kt-mk">📈 Chợ nông sản</button>
      <button type="button" class="nt-nut" data-tt="kt-tiem">🏪 Các tiệm</button>
      <button type="button" class="nt-nut" data-tt="kt-dg">🔨 Đấu giá</button>
      <button type="button" class="nt-nut" data-tt="thu" id="ntTtThu">📜 Nhật ký</button>
      <button type="button" class="nt-nut" data-tt="cac">🏙 Các thị trấn</button>
      <button type="button" class="nt-nut nt-nut-vang" data-tt="ld">⚔ Lôi đài</button>
      <button type="button" class="nt-nut" data-tt="bt">📌 Bảng tin</button>
      <button type="button" class="nt-nut nt-nut-xanh" data-tt="ve">🏡 Về nông trại</button>
    </div>
  </header>
  <div class="nt-tt-quang" id="ntTtQuang"></div>
  <div class="nt-tt-luoi" id="ntTtLuoi"></div>
</section>

<!-- Ho cau ca 钓鱼湖: ban do rieng; bong ca to = ca quy = cau hoi kho -->
<section class="nt-hc" id="ntHoCau" hidden aria-labelledby="ntHcTen">
  <header class="nt-hc-dau">
    <div class="nt-tt-bien nt-hc-bien">
      <h1 id="ntHcTen">Hồ câu cá</h1>
      <p><span lang="zh">钓鱼湖</span> diàoyú hú · <span id="ntHcMoi"></span></p>
    </div>
    <div class="nt-tt-nut">
      <button type="button" class="nt-nut nt-nut-vang" data-hc-nut="bst">📖 Bộ sưu tập cá</button>
      <button type="button" class="nt-nut" data-hc-nut="kho">🧺 Kho</button>
      <button type="button" class="nt-nut nt-nut-xanh" data-hc-nut="ve">🏡 Về nông trại</button>
    </div>
  </header>
  <div class="nt-hc-canh">
    <div class="nt-hc-ho" id="ntHcHo"></div>
    <div class="nt-hc-ben" aria-hidden="true"><div class="nt-hc-nv" id="ntHcNv"></div></div>
  </div>
  <div class="nt-hc-the" id="ntHcThe" aria-live="polite"></div>
</section>

<nav class="nt-duoi" id="ntDuoi" aria-label="Công cụ nông trại">
  <button type="button" class="nt-cu" data-mo="cuahang"><img src="/images/farm/tb-cuahang.svg" alt="" draggable="false"><span>Cửa hàng</span></button>
  <button type="button" class="nt-cu" data-mo="kho"><img src="/images/farm/tb-kho.svg" alt="" draggable="false"><span>Kho</span></button>
  <!-- Viec chinh: hoc bai kiem sao (sao mua moi thu trong nong trai) -->
  <a class="nt-cu nt-cu-cta" id="ntHocCta" href="/" aria-label="Học kiếm sao — vào bài đang học"><span class="nt-cta-hinh"><img src="/images/farm/tb-hoc.svg" alt="" draggable="false"></span><span>Học kiếm sao</span></a>
  <button type="button" class="nt-cu" data-mo="thitran"><img src="/images/farm/tb-ban.svg" alt="" draggable="false"><span>Thị trấn</span><i class="nt-cham" id="ntBanCham" hidden></i><i class="nt-cham" id="ntTtCham" hidden></i></button>
  <button type="button" class="nt-cu nt-cu-them" id="ntThemNut" aria-haspopup="dialog" aria-controls="ntThem"><span class="nt-them-ic" aria-hidden="true"><i></i><i></i><i></i></span><span>Thêm</span><i class="nt-cham" id="ntThemCham" hidden></i></button>
</nav>

<!-- Bang "Thêm": cac hoat dong khac (cung kieu bang voi cua hang, kho...) -->
<div class="nt-lop" id="ntThem" hidden>
  <section class="nt-bang nt-bang-them" role="dialog" aria-modal="true" aria-labelledby="ntThemTit">
    <header class="nt-bang-dau">
      <h2 id="ntThemTit">Hoạt động khác</h2>
      <button type="button" class="nt-dong" id="ntThemDong" aria-label="Đóng">✕</button>
    </header>
    <div class="nt-bang-than">
      <div class="nt-them-luoi" id="ntThemLuoi">
        <button type="button" class="nt-chuhan-nut" id="ntChuHan" aria-label="Thử thách chữ Hán — làm 10 câu nhận quà">
  <span class="nt-ch-ic" aria-hidden="true">字</span>
  <span class="nt-muc-chu"><b>Thử thách chữ Hán</b><small id="ntChuHanPhu">10 câu · nhận quà 🎁</small></span>
</button>
        <button type="button" class="nt-chuhan-nut nt-vq-nut" id="ntVongQuay" aria-label="Vòng quay may mắn">
  <span class="nt-ch-ic nt-vq-ic" aria-hidden="true"><svg viewBox="0 0 40 40"><g stroke="#2b1d3a" stroke-width="2"><path d="M20 20L20 4A16 16 0 0 1 36 20Z" fill="#ffd54f"/><path d="M20 20L36 20A16 16 0 0 1 20 36Z" fill="#ff8a65"/><path d="M20 20L20 36A16 16 0 0 1 4 20Z" fill="#81c784"/><path d="M20 20L4 20A16 16 0 0 1 20 4Z" fill="#64b5f6"/><circle cx="20" cy="20" r="4" fill="#fff"/></g></svg></span>
  <span class="nt-muc-chu"><b>Vòng quay may mắn</b><small id="ntVqPhu">học để có lượt quay</small></span>
</button>
        <button type="button" class="nt-chuhan-nut nt-hc-nut" id="ntHoCauNut" aria-label="Hồ câu cá">
  <span class="nt-ch-ic nt-hc-ic" aria-hidden="true"><svg viewBox="0 0 40 40"><g fill="none" stroke="#2b1d3a" stroke-width="2.2" stroke-linecap="round"><path d="M8 34L30 6"/><path d="M30 6Q36 14 32 24" stroke-width="1.4"/></g><path d="M14 30C18 23 28 23 32 28L37 24V34L32 31C28 36 18 36 14 30Z" fill="#ff9f43" stroke="#2b1d3a" stroke-width="2" stroke-linejoin="round"/><circle cx="19" cy="29" r="1.6" fill="#2b1d3a"/></svg></span>
  <span class="nt-muc-chu"><b>Hồ câu cá</b><small id="ntHcPhu">câu cá · trả lời chữ Hán</small></span>
</button>
        <button type="button" class="nt-them-o nt-them-pl" data-mo="kt-pl"><img src="/images/farm/tb-bando.svg" alt="" draggable="false"><span class="nt-muc-chu"><b>Bản đồ phiêu lưu</b><small id="ntPlPhu">5 vùng đất · câu hỏi từ bài em học</small></span></button>
        <button type="button" class="nt-them-o" data-mo="kt-mk"><img src="/images/farm/tb-cho.svg" alt="" draggable="false"><span class="nt-muc-chu"><b>Chợ nông sản</b><small id="ntMkPhu">giá lên xuống theo cung cầu</small></span></button>
        <button type="button" class="nt-them-o" data-mo="kt-xuong"><img src="/images/farm/tb-xuong.svg" alt="" draggable="false"><span class="nt-muc-chu"><b>Nhà máy chế biến</b><small id="ntXgPhu">bột, bánh, sữa, nước ép</small></span><i class="nt-cham" id="ntXgCham" hidden></i></button>
        <button type="button" class="nt-them-o" data-mo="kt-tiem"><img src="/images/farm/tb-tiem.svg" alt="" draggable="false"><span class="nt-muc-chu"><b>Cửa hàng riêng</b><small id="ntTiemPhu">mở tiệm bán cho bạn cùng lớp</small></span><i class="nt-cham" id="ntTiemCham" hidden></i></button>
        <button type="button" class="nt-them-o" data-mo="kt-nc"><img src="/images/farm/tb-nhancong.svg" alt="" draggable="false"><span class="nt-muc-chu"><b>Nhân công</b><small id="ntNcPhu">thuê người giúp việc nông trại</small></span></button>
        <button type="button" class="nt-them-o" data-mo="kt-xk"><img src="/images/farm/tb-xuatkhau.svg" alt="" draggable="false"><span class="nt-muc-chu"><b>Xuất khẩu</b><small id="ntXkPhu">chở hàng tới các vùng đất</small></span><i class="nt-cham" id="ntXkCham" hidden></i></button>
        <button type="button" class="nt-them-o" data-mo="kt-dg"><img src="/images/farm/tb-daugia.svg" alt="" draggable="false"><span class="nt-muc-chu"><b>Đấu giá</b><small id="ntDgPhu">hàng quý mỗi tuần</small></span><i class="nt-cham" id="ntDgCham" hidden></i></button>
        <button type="button" class="nt-them-o" data-mo="don"><img src="/images/farm/tb-don.svg" alt="" draggable="false"><span class="nt-muc-chu"><b>Đơn hàng</b><small>giao nông sản lấy xu</small></span><i class="nt-cham" id="ntDonCham" hidden></i></button>
        <button type="button" class="nt-them-o" data-mo="chung"><img src="/images/farm/tb-hoatdong.svg" alt="" draggable="false"><span class="nt-muc-chu"><b>Cùng nhau</b><small>công trình lớp · thách đấu · lễ hội</small></span><i class="nt-cham" id="ntChungCham" hidden></i></button>
        <button type="button" class="nt-them-o" data-mo="congdong"><img src="/images/farm/tb-congdong.svg" alt="" draggable="false"><span class="nt-muc-chu"><b>Cộng đồng</b><small>chợ chung · bạn bè các lớp</small></span></button>
        <button type="button" class="nt-them-o" data-mo="thidua" data-mo-tab="cup"><span class="nt-them-emo" aria-hidden="true">🏆</span><span class="nt-muc-chu"><b>Cúp các trại</b><small>trại học chăm nhất tuần · nông trại đẹp · thách đấu</small></span><i class="nt-cham" id="ntTdCham" hidden></i></button>
        <button type="button" class="nt-them-o" data-mo="vuon" id="ntThemVuon" hidden><span class="nt-them-emo" aria-hidden="true">🌱</span><span class="nt-muc-chu"><b>Vườn từ khó</b><small id="ntVuonPhu">ôn từ hay sai cho cây nở hoa</small></span><i class="nt-cham" id="ntVuonCham" hidden></i></button>
        <button type="button" class="nt-them-o" data-mo="cay7"><span class="nt-them-emo" aria-hidden="true">🌸</span><span class="nt-muc-chu"><b>Cây chăm chỉ</b><small id="ntCay7Phu">mỗi ngày học = 1 bông hoa</small></span><i class="nt-cham" id="ntCay7Cham" hidden></i></button>
        <button type="button" class="nt-them-o" data-mo="hoc" data-mo-tab="thidua"><img src="/images/farm/tb-hoc.svg" alt="" draggable="false"><span class="nt-muc-chu"><b>Thi đua tuần</b><small>bảng xếp hạng sao học</small></span></button>
      </div>
    </div>
  </section>
</div>

<div class="nt-zoom" aria-label="Phóng to thu nhỏ">
  <button type="button" id="ntZoomCong" aria-label="Phóng to">+</button>
  <button type="button" id="ntZoomTru" aria-label="Thu nhỏ">−</button>
</div>

<!-- Bang truot (cua hang, kho, don hang...) -->
<div class="nt-lop" id="ntLop" hidden>
  <section class="nt-bang" id="ntBang" role="dialog" aria-modal="true" aria-labelledby="ntBangTit">
    <header class="nt-bang-dau">
      <h2 id="ntBangTit"></h2>
      <button type="button" class="nt-dong" id="ntBangDong" aria-label="Đóng">✕</button>
    </header>
    <div class="nt-tab" id="ntBangTab"></div>
    <div class="nt-bang-than" id="ntBangThan"></div>
  </section>
</div>

<!-- Cau hoi on tu (cho an / tuoi nuoc) -->
<div class="nt-lop" id="ntHoi" hidden>
  <section class="nt-hoi" role="dialog" aria-modal="true" aria-labelledby="ntHoiTit">
    <header class="nt-hoi-dau">
      <img id="ntHoiAnh" src="" alt="" draggable="false">
      <div>
        <h2 id="ntHoiTit"></h2>
        <p id="ntHoiPhu"></p>
      </div>
      <button type="button" class="nt-dong" id="ntHoiDong" aria-label="Đóng">✕</button>
    </header>
    <div class="nt-hoi-tien" id="ntHoiTien"></div>
    <div class="nt-hoi-cau" id="ntHoiCau"></div>
    <div class="nt-hoi-chon" id="ntHoiChon"></div>
    <p class="nt-hoi-bao" id="ntHoiBao" role="status"></p>
    <p class="nt-hoi-nguon" id="ntHoiNguon"></p>
  </section>
</div>

<!-- Chua dang nhap -->
<div class="nt-lop nt-lop-dac" id="ntCong" hidden>
  <section class="nt-cong">
    <img src="/images/farm/nha-1.svg" alt="" draggable="false">
    <h1>Nông trại của em</h1>
    <p>Đăng nhập để có nông trại riêng. Học bài kiếm sao, rồi dùng sao mua gà, bò, hoa, đèn lồng… trang trí nông trại đẹp nhất lớp!</p>
    <a class="nt-nut nt-nut-xanh nt-nut-to" href="/#dang-nhap">Đăng nhập</a>
  </section>
</div>

<div class="nt-bao" id="ntBao" role="status" aria-live="polite"></div>

<script src="/js/nhac-nen.js"></script>
<script src="/js/data.js"></script>
<script src="/js/nong-trai-nv.js"></script>
<script src="/js/cau-dt.js"></script>
<script src="/js/nong-trai.js"></script>
<script src="/js/nong-trai-kt.js"></script>
</body>
</html>
