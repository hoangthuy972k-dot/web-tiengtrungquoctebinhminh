<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chế độ lớp học · Hi Hán 喜汉</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700;900&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/lop.css">
</head>
<body class="lop-body">

<!-- Tranh son thuy nen — dung chung voi trang chinh -->
<div class="scene" aria-hidden="true">
  <div class="scene-layer scene-far"></div>
  <div class="scene-mist"></div>
  <div class="scene-layer scene-tree"></div>
  <div class="scene-layer scene-bamboo"></div>
  <div class="scene-veil"></div>
</div>

<!-- ================= MAN HINH CHUAN BI ================= -->
<div id="lopSetup" class="lop-setup">
  <div class="lop-setup-card">
    <div class="lop-setup-head">
      <div class="lop-logo">喜汉</div>
      <div>
        <h1>Chế độ lớp học</h1>
        <p>Trò chơi đầu giờ để chiếu lên lớp · ôn lại bài đã học</p>
      </div>
    </div>

    <div class="lop-field">
      <label for="lopLevel">1 · Cấp độ</label>
      <select id="lopLevel">
        <option value="hsk1">HSK 1 (giáo trình cũ)</option>
        <option value="hsk1v3">HSK 1 · 3.0</option>
        <option value="hsk2">HSK 2 (giáo trình cũ)</option>
        <option value="hsk2v3">HSK 2 · 3.0</option>
        <option value="hsk3" selected>HSK 3</option>
        <option value="hsk4">HSK 4</option>
        <option value="yct">YCT · Thiếu nhi</option>
      </select>
    </div>

    <div class="lop-field">
      <label>2 · Chọn bài đã học để ôn</label>
      <div class="lop-lesson-tools">
        <button type="button" class="lop-mini-btn" id="lopPickAll">Chọn tất cả</button>
        <button type="button" class="lop-mini-btn" id="lopPickNone">Bỏ chọn</button>
        <button type="button" class="lop-mini-btn" id="lopPickRandom">🎲 Quay ngẫu nhiên 1 bài</button>
      </div>
      <div id="lopPickState" class="lop-pick-state"></div>
      <div id="lopLessons" class="lop-lessons">Đang tải…</div>
    </div>

    <div class="lop-field">
      <label>3 · Số tổ</label>
      <div class="lop-team-pick" id="lopTeamPick">
        <button type="button" data-n="2">2 tổ</button>
        <button type="button" data-n="4" class="active">4 tổ</button>
        <button type="button" data-n="6">6 tổ</button>
      </div>
    </div>

    <div class="lop-field">
      <label>4 · Chọn trò chơi</label>
      <div class="lop-games">
        <button type="button" class="lop-game-card" data-game="errfix">
          <span class="lop-game-emoji">🔍</span>
          <span class="lop-game-name">Bắt lỗi sai tiếp sức</span>
          <span class="lop-game-desc">Chiếu 5 câu, có câu sai. Mỗi tổ cử 1 em lên bảng khoanh câu sai và viết lại câu đúng.</span>
          <span class="lop-game-count" id="lopCountErrfix">—</span>
        </button>
        <button type="button" class="lop-game-card" data-game="abc">
          <span class="lop-game-emoji">🅰️</span>
          <span class="lop-game-name">Giơ thẻ A / B / C</span>
          <span class="lop-game-desc">Chiếu câu có chỗ trống, đếm ngược 10 giây, cả lớp giơ thẻ. Tổ nào đúng nhiều nhất được điểm.</span>
          <span class="lop-game-count" id="lopCountAbc">—</span>
        </button>
        <button type="button" class="lop-game-card" data-game="sort">
          <span class="lop-game-emoji">🧩</span>
          <span class="lop-game-name">Xếp câu bằng người</span>
          <span class="lop-game-desc">Chiếu các thẻ từ lộn xộn. Mỗi tổ cử mấy em lên bảng, mỗi em cầm một thẻ rồi đứng xếp thành câu đúng.</span>
          <span class="lop-game-count" id="lopCountSort">—</span>
        </button>
        <button type="button" class="lop-game-card" data-game="bingo">
          <span class="lop-game-emoji">🔢</span>
          <span class="lop-game-name">Bingo 3×3</span>
          <span class="lop-game-desc">Chiếu 15 từ, mỗi em chọn 9 từ viết vào lưới 3×3 trong vở. Web gọi từng từ, ai đủ 3 ô thẳng hàng thì hô 中了!</span>
          <span class="lop-game-count lop-count-vocab">từ vựng</span>
        </button>
        <button type="button" class="lop-game-card" data-game="guess">
          <span class="lop-game-emoji">🖼️</span>
          <span class="lop-game-name">Nhìn hình đoán chữ</span>
          <span class="lop-game-desc">Chiếu hình minh hoạ, tổ nào đoán được chữ Hán và pinyin thì giơ tay. Lật ra có cả nghĩa và phát âm.</span>
          <span class="lop-game-count lop-count-vocab">từ vựng</span>
        </button>
        <button type="button" class="lop-game-card" data-game="tiles">
          <span class="lop-game-emoji">🎴</span>
          <span class="lop-game-name">Lật ô đoán chữ</span>
          <span class="lop-game-desc">Hình bị che bởi 9 ô. Mỗi tổ mở một ô rồi đoán — có ô thưởng +1 điểm và ô mất lượt.</span>
          <span class="lop-game-count lop-count-vocab">từ vựng</span>
        </button>
        <button type="button" class="lop-game-card" data-game="taboo">
          <span class="lop-game-emoji">🗣️</span>
          <span class="lop-game-name">Bạn nói tôi đoán</span>
          <span class="lop-game-desc">Một em quay lưng với màn hình, tổ mô tả bằng tiếng Trung mà không được nói chính từ đó. 60 giây được mấy từ.</span>
          <span class="lop-game-count lop-count-vocab">từ vựng</span>
        </button>
        <button type="button" class="lop-game-card" data-game="trans">
          <span class="lop-game-emoji">✍️</span>
          <span class="lop-game-name">Dịch nhanh Việt → Trung</span>
          <span class="lop-game-desc">Chiếu câu tiếng Việt, mỗi tổ cử 1 em lên bảng viết câu tiếng Trung. Lật ra có cả câu mẫu và phiên âm.</span>
          <span class="lop-game-count lop-count-vocab">câu dịch</span>
        </button>
        <button type="button" class="lop-game-card" data-game="listen">
          <span class="lop-game-emoji">👂</span>
          <span class="lop-game-name">Nghe nhanh chỉ chữ</span>
          <span class="lop-game-desc">Chiếu 9 chữ Hán, máy đọc một từ. Hai em đại diện hai tổ lên bảng, ai chỉ đúng trước thì thắng.</span>
          <span class="lop-game-count lop-count-vocab">từ vựng</span>
        </button>
        <button type="button" class="lop-game-card" data-game="hanzi">
          <span class="lop-game-emoji">🀄</span>
          <span class="lop-game-name">Đoán chữ qua bộ thủ</span>
          <span class="lop-game-desc">Chiếu bộ thủ, số nét, cấu tạo và mẹo nhớ — không hiện chữ. Tổ nào đoán ra chữ Hán thì được điểm.</span>
          <span class="lop-game-count lop-count-vocab">chiết tự</span>
        </button>
        <button type="button" class="lop-game-card" data-game="role">
          <span class="lop-game-emoji">🎭</span>
          <span class="lop-game-name">Đóng vai bài khoá</span>
          <span class="lop-game-desc">Chiếu hội thoại của bài nhưng che lời một vai, chỉ để lại nghĩa tiếng Việt. Hai em lên đóng vai, em giữ vai bị che phải tự nói.</span>
          <span class="lop-game-count lop-count-vocab">bài khoá</span>
        </button>
        <button type="button" class="lop-game-card" data-game="hv">
          <span class="lop-game-emoji">🔤</span>
          <span class="lop-game-name">Âm Hán–Việt đoán chữ</span>
          <span class="lop-game-desc">Chiếu âm Hán–Việt (nhĩ, hảo, học sinh…) và nghĩa, tổ đoán chữ Hán. Tận dụng vốn từ Hán–Việt sẵn có của học sinh.</span>
          <span class="lop-game-count lop-count-vocab">từ vựng</span>
        </button>
        <button type="button" class="lop-game-card" data-game="match">
          <span class="lop-game-emoji">🔗</span>
          <span class="lop-game-name">Nối nghĩa nhanh</span>
          <span class="lop-game-desc">Sáu chữ Hán bên trái, sáu nghĩa xáo trộn bên phải. Tổ đọc từng cặp “1 – C”, thầy/cô bấm để kiểm tra.</span>
          <span class="lop-game-count lop-count-vocab">từ vựng</span>
        </button>
        <button type="button" class="lop-game-card" data-game="chain">
          <span class="lop-game-emoji">🐉</span>
          <span class="lop-game-name">Nối từ 接龙</span>
          <span class="lop-game-desc">Chiếu chữ cuối của từ trước, tổ nào nói được từ bắt đầu bằng chữ đó thì được điểm. Web tra sẵn còn từ nào nối được.</span>
          <span class="lop-game-count lop-count-vocab">từ vựng</span>
        </button>
        <button type="button" class="lop-game-card" data-game="write">
          <span class="lop-game-emoji">🖊️</span>
          <span class="lop-game-name">Thi viết bảng nhanh</span>
          <span class="lop-game-desc">Máy đọc một từ (hoặc cả câu), các tổ viết chữ Hán lên bảng. Lật ra có chữ và phiên âm để chấm.</span>
          <span class="lop-game-count lop-count-vocab">từ vựng</span>
        </button>
      </div>
    </div>

    <p class="lop-note">💡 Mẹo: bấm <b>F11</b> để chiếu toàn màn hình. Trong lúc chơi dùng phím <b>Space</b> để lật đáp án, phím <b>1…6</b> để cộng điểm cho tổ.</p>
  </div>
</div>

<!-- ================= MAN HINH CHOI ================= -->
<div id="lopPlay" class="lop-play" hidden>
  <header class="lop-bar">
    <button type="button" class="lop-bar-btn" id="lopExit">← Đổi bài / đổi trò</button>
    <div class="lop-bar-title" id="lopTitle">Bắt lỗi sai tiếp sức</div>
    <div class="lop-bar-sub" id="lopSub"></div>
    <div class="lop-bar-right">
      <div class="lop-timer" id="lopTimer">00:30</div>
      <button type="button" class="lop-bar-btn" id="lopTimerToggle">▶ Bắt đầu</button>
      <button type="button" class="lop-bar-btn" id="lopTimerSet" title="Đổi thời gian">30s</button>
      <button type="button" class="lop-bar-btn" id="lopRoll">🎲 Gọi số</button>
    </div>
  </header>

  <main class="lop-stage" id="lopStage"></main>

  <footer class="lop-scorebar" id="lopScorebar"></footer>
</div>

<!-- Hop thoai quay so bao danh -->
<div id="lopRollBox" class="lop-roll-box" hidden>
  <div class="lop-roll-card">
    <div class="lop-roll-label">Số báo danh</div>
    <div class="lop-roll-number" id="lopRollNumber">–</div>
    <div class="lop-roll-actions">
      <label>Sĩ số <input type="number" id="lopClassSize" min="2" max="99" value="50"></label>
      <button type="button" class="btn btn-primary" id="lopRollAgain">Quay lại</button>
      <button type="button" class="lop-mini-btn" id="lopRollClose">Đóng</button>
    </div>
    <div class="lop-roll-hint" id="lopRollHint"></div>
  </div>
</div>

<script src="/js/lop.js"></script>
</body>
</html>
