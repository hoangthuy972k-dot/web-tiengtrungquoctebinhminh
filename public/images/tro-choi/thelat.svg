    <rect x="171" y="44" width="58" height="66" rx="8" fill="#f3d6b3"/>
    <rect x="171" y="44" width="58" height="59" rx="8" fill="#fff8ec"/>
    <rect x="176" y="49" width="16" height="4" rx="2" fill="#ffb86b" opacity="0.7"/>
