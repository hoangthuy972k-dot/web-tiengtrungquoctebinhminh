    <ellipse cx="-12" cy="9" rx="6" ry="9" fill="#ffd7b5" stroke="#2b1d3a" stroke-width="3" transform="rotate(-30 -12 9)"/>
    <rect x="-10" y="-4" width="30" height="28" rx="10" fill="#ffd7b5" stroke="#2b1d3a" stroke-width="3" stroke-linejoin="round"/>
