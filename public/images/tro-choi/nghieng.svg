    <path d="M196 80 Q200 68 212 72" fill="none" stroke="#2b1d3a" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="184" cy="134" r="5.5" fill="#2b1d3a"/>
    <circle cx="216" cy="134" r="5.5" fill="#2b1d3a"/>
    <circle cx="186" cy="132" r="1.8" fill="#fff8ec"/>
    <circle cx="218" cy="132" r="1.8" fill="#fff8ec"/>
    <ellipse cx="171" cy="148" rx="7" ry="4" fill="#ff8fa3" opacity="0.75"/>
