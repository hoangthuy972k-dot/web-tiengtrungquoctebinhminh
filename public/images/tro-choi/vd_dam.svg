  <ellipse cx="338" cy="214" rx="38" ry="7" fill="#2b1d3a" opacity="0.25"/>
  <g transform="rotate(12 338 210)">
    <path d="M338 92 C363 92 376 124 376 158 C376 190 361 210 338 210 C315 210 300 190 300 158 C300 124 313 92 338 92 Z" fill="#3cc0b0"/>
    <path d="M302.5 178 C308 198 321 208 338 208 C355 208 368 198 373.500 178 Z" fill="#16877a"/>
    <path d="M301 166 C325 173 351 173 375 166 L374 178 C351 185 325 185 302 178 Z" fill="#fff8ec" stroke="#2b1d3a" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M338 92 C363 92 376 124 376 158 C376 190 361 210 338 210 C315 210 300 190 300 158 C300 124 313 92 338 92 Z" fill="none" stroke="#2b1d3a" stroke-width="4"/>
    <ellipse cx="319" cy="116" rx="5.500" ry="11" fill="#fff" opacity="0.45" transform="rotate(22 319 116)"/>
    <path d="M313 112 C328 119 348 119 363 112" fill="none" stroke="#ef4f43" stroke-width="7" stroke-linecap="round"/>
    <path d="M362 112 l12 -6 M362 113 l13 4" stroke="#ef4f43" stroke-width="5" stroke-linecap="round"/>
    <path d="M321 133 l9 5 -9 5 M355 133 l-9 5 9 5" fill="none" stroke="#2b1d3a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="338" cy="152" rx="5" ry="6" fill="#2b1d3a"/>
    <ellipse cx="316" cy="148" rx="6" ry="3.500" fill="#ff9fae" opacity="0.8"/>
    <ellipse cx="360" cy="148" rx="6" ry="3.500" fill="#ff9fae" opacity="0.8"/>
  </g>

  <!-- thanh nang luong -->
  <rect x="290" y="62" width="92" height="16" rx="8" fill="#fff8ec" stroke="#2b1d3a" stroke-width="3.500"/>
  <rect x="294" y="66" width="46" height="8" rx="4" fill="#ef6a4f"/>

  <use href="#vddam-spark" transform="translate(300 40) scale(1.2)"/>
  <use href="#vddam-spark" transform="translate(150 30)"/>
  <use href="#vddam-spark" transform="translate(60 150) scale(0.8)"/>
  <circle cx="110" cy="140" r="3" fill="#fff8ec" opacity="0.8"/>
  <circle cx="200" cy="34" r="2.500" fill="#fff8ec" opacity="0.8"/>

  <!-- khung ngam camera -->
  <g fill="none" stroke="#fff8ec" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <path d="M24 52 V32 Q24 18 38 18 H58"/>
    <path d="M342 18 H362 Q376 18 376 32 V52"/>
    <path d="M24 188 V208 Q24 222 38 222 H58"/>
    <path d="M342 222 H362 Q376 222 376 208 V188"/>
  </g>
  <circle cx="352" cy="40" r="6" fill="#ff4d6d" stroke="#fff8ec" stroke-width="2.500"/>
