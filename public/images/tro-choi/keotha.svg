    <path d="M3 -3 V6 M10 -3 V6" stroke="#2b1d3a" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-3" y="-22" width="4" height="8" rx="2" fill="#fff1e2"/>
    <rect x="-12" y="22" width="34" height="10" rx="4" fill="#5ab0ff" stroke="#2b1d3a" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g fill="none" stroke="#fff8ec" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <path d="M214 118 Q218 112 224 112"/>
    <path d="M244 116 Q248 120 247 126"/>
  </g>

  <!-- sparkles -->
  <path d="M28 54 Q28 60 34 60 Q28 60 28 66 Q28 60 22 60 Q28 60 28 54Z" fill="#fff8ec"/>
  <path d="M372 150 Q372 155 377 155 Q372 155 372 160 Q372 155 367 155 Q372 155 372 150Z" fill="#fff8ec" opacity="0.9"/>
  <path d="M200 30 Q200 34 204 34 Q200 34 200 38 Q200 34 196 34 Q200 34 200 30Z" fill="#fff8ec" opacity="0.85"/>
  <circle cx="160" cy="214" r="2.5" fill="#fff8ec" opacity="0.7"/>
  <circle cx="356" cy="210" r="2" fill="#fff8ec" opacity="0.6"/>
  <circle cx="44" cy="120" r="2" fill="#fff8ec" opacity="0.7"/>
</svg>
