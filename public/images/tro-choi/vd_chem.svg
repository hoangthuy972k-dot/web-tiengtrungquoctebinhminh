<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Ngón tay vẽ vệt sáng chém đôi quả dưa hấu trước camera">
  <defs>
    <linearGradient id="vdchem-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ed957"/>
      <stop offset="1" stop-color="#2f8a57"/>
    </linearGradient>
    <g id="vdchem-half">
      <path d="M-52 0 A52 52 0 0 0 52 0 Z" fill="#2f9e4f"/>
      <path d="M-30 40 A52 52 0 0 0 30 40 A60 40 0 0 1 -30 40 Z" fill="#1f7a3d"/>
      <path d="M-45 0 A45 45 0 0 0 45 0 Z" fill="#c8f08f"/>
      <path d="M-40 0 A40 40 0 0 0 40 0 Z" fill="#ff5a6e"/>
      <path d="M-36 18 A40 40 0 0 0 36 18 A44 30 0 0 1 -36 18 Z" fill="#e23e56"/>
      <ellipse cx="-22" cy="8" rx="9" ry="4" fill="#ff8a98"/>
      <ellipse cx="-18" cy="16" rx="2.5" ry="4" fill="#2b1d3a" transform="rotate(25 -18 16)"/>
      <ellipse cx="0" cy="22" rx="2.5" ry="4" fill="#2b1d3a"/>
      <ellipse cx="18" cy="16" rx="2.5" ry="4" fill="#2b1d3a" transform="rotate(-25 18 16)"/>
      <ellipse cx="-8" cy="8" rx="2" ry="3.2" fill="#2b1d3a"/>
      <ellipse cx="10" cy="7" rx="2" ry="3.2" fill="#2b1d3a"/>
      <path d="M-52 0 A52 52 0 0 0 52 0 Z" fill="none" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round"/>
    </g>
    <path id="vdchem-spark" d="M0 -7 Q1 -1 7 0 Q1 1 0 7 Q-1 1 -7 0 Q-1 -1 0 -7 Z" fill="#fff8ec"/>
  </defs>

  <rect width="400" height="240" fill="url(#vdchem-bg)"/>
  <circle cx="60" cy="40" r="72" fill="#fff8ec" opacity="0.13"/>
  <circle cx="365" cy="62" r="52" fill="#fff8ec" opacity="0.1"/>
  <circle cx="330" cy="215" r="95" fill="#1f6b45" opacity="0.18"/>
  <circle cx="150" cy="120" r="38" fill="#fff8ec" opacity="0.07"/>

  <path d="M0 196 Q200 174 400 196 V240 H0 Z" fill="#2a7a4c"/>
  <path d="M0 196 Q200 174 400 196" fill="none" stroke="#9be86e" stroke-width="3" opacity="0.5"/>
  <ellipse cx="180" cy="205" rx="60" ry="7" fill="#1d5c39" opacity="0.5"/>

  <!-- flying orange -->
  <g stroke="#fff8ec" stroke-width="4" stroke-linecap="round" opacity="0.75">
    <path d="M112 100 L124 110"/>
    <path d="M102 108 L110 118"/>
  </g>
  <circle cx="86" cy="74" r="24" fill="#ffa31a"/>
  <path d="M108.6 65.8 A24 24 0 0 1 77.8 96.6 A30 30 0 0 0 108.6 65.8 Z" fill="#f07f0a"/>
  <ellipse cx="77" cy="64" rx="7" ry="4" fill="#fff8ec" opacity="0.8" transform="rotate(-35 77 64)"/>
  <circle cx="92" cy="80" r="1.6" fill="#e06d00"/>
  <circle cx="80" cy="84" r="1.6" fill="#e06d00"/>
  <circle cx="98" cy="70" r="1.6" fill="#e06d00"/>
  <circle cx="86" cy="74" r="24" fill="none" stroke="#2b1d3a" stroke-width="3.5"/>
  <path d="M86 51 L84 44" stroke="#2b1d3a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M86 48 Q98 34 112 42 Q100 54 86 48 Z" fill="#4cc35a" stroke="#2b1d3a" stroke-width="3" stroke-linejoin="round"/>

  <!-- watermelon halves -->
  <use href="#vdchem-half" transform="translate(171 123) rotate(149)"/>
  <use href="#vdchem-half" transform="translate(181 147) rotate(-15)"/>

  <!-- juice drops -->
  <circle cx="122" cy="118" r="4.5" fill="#ff5a6e" stroke="#2b1d3a" stroke-width="2"/>
  <circle cx="112" cy="160" r="3" fill="#ff5a6e"/>
  <circle cx="238" cy="172" r="3.5" fill="#ff5a6e" stroke="#2b1d3a" stroke-width="2"/>
  <circle cx="246" cy="98" r="3" fill="#ff5a6e"/>

  <!-- glowing slash trail -->
  <path d="M48 190 Q162 118 284 66 L304 100 Q182 158 48 190 Z" fill="#fff8ec" opacity="0.3"/>
  <path d="M56 186 Q168 128 286 78 L298 94 Q178 146 56 186 Z" fill="#ffffff"/>

  <!-- hand -->
  <g stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round">
    <rect x="264" y="206" width="60" height="46" rx="10" fill="#ff7a59"/>
    <rect x="262" y="204" width="64" height="13" rx="6.5" fill="#fff8ec"/>
    <rect x="280" y="80" width="24" height="82" rx="12" fill="#ffd7b5"/>
    <rect x="258" y="140" width="72" height="74" rx="26" fill="#ffd7b5"/>
  </g>
  <rect x="294" y="98" width="6" height="40" rx="3" fill="#f4b896"/>
  <rect x="285" y="102" width="4" height="16" rx="2" fill="#fff8ec" opacity="0.8"/>
  <rect x="285" y="84" width="14" height="13" rx="6" fill="#ffeadb" stroke="#2b1d3a" stroke-width="2"/>
  <rect x="270" y="196" width="48" height="12" rx="6" fill="#f4b896"/>
  <g stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round" fill="#ffd7b5">
    <rect x="296" y="146" width="44" height="20" rx="10"/>
    <rect x="296" y="166" width="44" height="20" rx="10"/>
    <rect x="296" y="186" width="40" height="20" rx="10"/>
    <rect x="258" y="168" width="48" height="20" rx="10" transform="rotate(-15 282 178)"/>
  </g>
  <rect x="268" y="171" width="18" height="5" rx="2.5" fill="#fff8ec" opacity="0.7" transform="rotate(-15 277 173)"/>

  <!-- sparkles -->
  <use href="#vdchem-spark" transform="translate(300 62) scale(1.3)"/>
  <use href="#vdchem-spark" transform="translate(140 52)"/>
  <use href="#vdchem-spark" transform="translate(236 128) scale(0.8)"/>
  <use href="#vdchem-spark" transform="translate(52 140) scale(0.7)"/>
  <circle cx="320" cy="96" r="3" fill="#fff8ec"/>
  <circle cx="214" cy="60" r="2.5" fill="#fff8ec" opacity="0.8"/>
  <circle cx="60" cy="110" r="2.5" fill="#fff8ec" opacity="0.7"/>

  <!-- camera viewfinder -->
  <g fill="none" stroke="#fff8ec" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <path d="M24 52 V32 Q24 18 38 18 H58"/>
    <path d="M342 18 H362 Q376 18 376 32 V52"/>
    <path d="M24 188 V208 Q24 222 38 222 H58"/>
    <path d="M342 222 H362 Q376 222 376 208 V188"/>
  </g>
  <circle cx="352" cy="40" r="6" fill="#ff4d6d" stroke="#fff8ec" stroke-width="2.5"/>
</svg>
