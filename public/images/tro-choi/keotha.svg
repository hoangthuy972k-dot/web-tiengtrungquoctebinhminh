    <circle cx="268" cy="174" r="6" fill="#ffd23f"/>
    <circle cx="132" cy="120" r="6" fill="#ff7eb6"/>
    <circle cx="268" cy="66" r="6" fill="#ff7eb6"/>
    <circle cx="132" cy="174" r="6" fill="#7ef0c8"/>
    <circle cx="231" cy="131" r="6" fill="#7ef0c8"/>
